{{ define "main" }}
<header class="hero">
  <div class="container">
    <h1 class="hero-title">{{ site.Title }}</h1>
    {{- with site.Params.tagline }}
    <p class="hero-subtitle">{{ . }}</p>
    {{- end }}
  </div>
</header>
{{- with site.Params.homeBanner }}
<main class="home-banner" style="background-image:url('{{ . | relURL }}')"></main>
{{- else }}
<main class="home-banner"></main>
{{- end }}
{{ end }}
